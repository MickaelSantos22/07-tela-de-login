<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="container">

        <h1>
            Registration
        </h1>

        <form action="#">
            <div class="input-box">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">
            </div>

            <div class="input-box">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username">
            </div>

            <div class="input-box">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="input-box">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your number">
            </div>

            <div class="input-box">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>

            <div class="input-box">
                <label for="conf-password">Confirm Password</label>
                <input type="password" id="conf-password" placeholder="Confirm your password">
            </div>

            <h3>Gender</h3>

            <div class="genders">

                <div class="male-gender">
                    <input type="radio" id="male" name="gender">
                    <label for="male">Male</label>
                </div>

                <div class="female-gender">
                    <input type="radio" id="female" name="gender">
                    <label for="female">Female</label>
                </div>

                <div class="not_say-gender">
                    <input type="radio" id="not_to_say" name="gender">
                    <label for="not_to_say">Prefer not to say</label>
                </div>
            </div>

            <button>
                Register
            </button>

        </form>

    </main>


</body>

</html>
